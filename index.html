async function driveAddFile(sp,f){const D=driveSpace(sp),x=await storeFile(f,{kind:'Mapa',ref:sp});if(!x)return;D.items.push({id:uid(),folder:DRV[sp]?.f||'',type:'file',name:f.name,fileId:x.id,mime:f.type||x.type,size:f.size,created:Date.now()});await saveDrive()}

async function viewFile(fileId,name){const f=await DB.get('files',fileId);if(!f)return toast('Datoteke ni.','err');const b=dataURLtoBlob(f.data),u=URL.createObjectURL(b);

    foot:`<span class="grow"></span><button class="btn" data-md="open">Odpri v novem oknu</button><button class="btn" data-md="dl">${ic('download')}Prenesi</button><button class="btn pri" data-md="print">${ic('print')}Natisni</button>`,
    onClick:e=>{const a=e.target.closest('[data-md]')?.dataset.md;if(a==='open')window.open(u,'_blank');if(a==='dl')download(b,f.name);if(a==='print')printFile(f,u)}});}

  if(/image/.test(f.type)){printPage(f.name,`<img src="${f.data}" style="max-width:100%;max-height:250mm;display:block;margin:auto">`);return}

document.addEventListener('change',e=>{if(e.target.id==='divSel')setDivF(e.target.value)});
document.addEventListener('input',e=>{const q=e.target.closest('[data-dq]');if(!q)return;const sp=q.closest('.drive').dataset.space;DRV[sp].q=q.value;const p=q.selectionStart;rerenderDrive(sp);const n=document.querySelector(`.drive[data-space="${sp}"] [data-dq]`);n.focus();n.setSelectionRange(p,p)});

  const df=t.closest('[data-df]');if(df){st.f=df.dataset.df;st.q='';rerenderDrive(sp);return}

  if(a==='note'){editNote(sp,null);return}

    ${divs().length?divSelect('data-pbdiv',b.div,'Program'):''}

$('#vPlb').addEventListener('input',e=>{const t=e.target,b=PB;if(!b)return;const m=t.dataset.m;
  if(m&&m.startsWith('pb_')){const k=m.slice(3);b[k]=k==='disc'?num(t.value):t.value;$('#vPlb .pbprev').innerHTML=pbDocHTML();return}

  if(t.dataset.pbc){b.cols[t.dataset.pbc]=t.checked}if(t.hasAttribute('data-pbg'))b.group=t.checked;if(t.hasAttribute('data-pbdiv'))b.div=t.value;$('#vPlb .pbprev').innerHTML=pbDocHTML()});

/* ================= trips: vehicle type, routing ================= */
async function geocode(q){const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q);let j;try{j=await (await fetch(u,{headers:{'Accept-Language':'sl'}})).json()}catch{j=(await fetchVia(u,'json',12000)).body}if(!j||!j[0])throw new Error('kraja ni mogoče najti: '+q);return[+j[0].lon,+j[0].lat]}
async function routeKm(stops){const pts=[];for(const s of stops)pts.push(await geocode(s));const u=`https://router.project-osrm.org/route/v1/driving/${pts.map(p=>p.join(',')).join(';')}?overview=false`;let j;try{j=await (await fetch(u)).json()}catch{j=(await fetchVia(u,'json',15000)).body}if(!j||j.code!=='Ok')throw new Error('poti ni mogoče izračunati');return j.routes[0].distance/1000}
const gmapsDir=stops=>`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(stops[0])}&destination=${encodeURIComponent(stops[stops.length-1])}${stops.length>2?'&waypoints='+encodeURIComponent(stops.slice(1,-1).join('|')):''}&travelmode=driving`;

/* ================= toast ================= */
function toast(msg,type='',ms=3500,action){
  const el=document.createElement('div');el.className='tst'+(type==='err'?' err':'');el.innerHTML=`<span>${esc(msg)}</span>`;
  if(action){const b=document.createElement('button');b.textContent=action.label;b.onclick=()=>{el.remove();action.fn()};el.appendChild(b)}
  $('#toast').appendChild(el);setTimeout(()=>el.remove(),ms);
}

/* ================= global paste & keys ================= */
document.addEventListener('paste',e=>{
  if(!cur||!$('#vEdit').classList.contains('on')||!$('#sheet').hidden)return;
  const tg=e.target;if(tg.closest&&tg.closest('input,textarea,select,[contenteditable]'))return;
  const files=[...(e.clipboardData?.files||[])];if(files.length){e.preventDefault();handleFiles(files);return}
  const txt=(e.clipboardData.getData('text/plain')||'').trim(),html=e.clipboardData.getData('text/html');
  if(/^https?:\/\//.test(txt)){e.preventDefault();startImport(txt);return}
  if(html&&/<img/i.test(html)){e.preventDefault();importFromHTML(html,'');return}
  if(txt){e.preventDefault();startImport(txt)}
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='p'&&cur&&$('#vEdit').classList.contains('on')&&$('#sheet').hidden){e.preventDefault();printDoc()}});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(!cur&&$('#vList').classList.contains('on'))topSimple('Ponudbe')});
addEventListener('visibilitychange',()=>{if(document.hidden&&cur)saveQuoteNow()});
