<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STIK Prodaja</title>
<meta name="theme-color" content="#152033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ponudbe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
/* ============ APP ============ */
:root{
  --ink:#152033;--ink2:#4F5B72;--mute:#8791A4;--line:#DAE0E8;--line2:#E9EDF2;
  --canvas:#E6EAF0;--surf:#FFFFFF;--soft:#F5F7FA;
  --acc:#1E4FD8;--acc-soft:#E6EDFC;--sig:#FFC400;--sig-ink:#3A2C00;
  --ok:#1C8B55;--bad:#C4362C;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--canvas)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surf);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:#B9C2CF;background:var(--soft)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#26344D}
.btn.sig{background:var(--sig);color:var(--sig-ink);border-color:var(--sig);font-weight:600}
.btn.sig:hover{background:#FFD23F}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:rgba(21,32,51,.06)}
.btn.icon{padding:0;width:38px}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.sm.icon{width:32px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}

/* top bar */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:calc(8px + var(--st)) 16px 8px;background:var(--surf);border-bottom:1px solid var(--line);min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:17px;cursor:pointer;user-select:none}
.mark{width:30px;height:30px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.mark svg{width:18px;height:18px}
.top .grow{flex:1;min-width:0}
.top .ttl{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .saved{font-size:12px;color:var(--mute)}
.acts{display:flex;gap:8px;align-items:center}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(21,32,51,.18);padding:6px;min-width:250px;z-index:60}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;font-size:14px}
.menu button:hover{background:var(--soft)}
.menu small{display:block;color:var(--mute);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line2);margin:5px 4px}

.view{display:none}
.view.on{display:block}

/* list */
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px calc(40px + var(--sb))}
.list-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.list-head h1{font-size:28px;margin:0 auto 0 0;letter-spacing:-.02em}
.search{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:40px;flex:1 1 240px;max-width:360px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.qcard{background:var(--surf);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:76px 1fr;cursor:pointer;overflow:hidden;transition:border-color .15s}
.qcard:hover{border-color:#AEB8C6}
.qcard .th{background:var(--soft) center/cover no-repeat;min-height:100%}
.qcard .bd{padding:12px 14px;min-width:0}
.qcard .r1{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink2)}
.qcard h3{margin:4px 0 2px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcard .ct{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcard .r3{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.qcard .sum{font-weight:700}
.qcard .ops{display:flex;gap:2px}
.status{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--ink2)}
.status.poslano{background:var(--acc-soft);color:var(--acc)}
.status.sprejeto{background:#DDF3E7;color:var(--ok)}
.status.zavrnjeno{background:#F8E1DF;color:var(--bad)}
.empty{background:var(--surf);border:1.5px dashed var(--line);border-radius:14px;padding:48px 20px;text-align:center;color:var(--ink2)}
.empty h2{color:var(--ink);margin:0 0 6px;font-size:20px}
.empty .acts{justify-content:center;margin-top:16px;flex-wrap:wrap}

/* editor */
.ed-grid{display:grid;grid-template-columns:minmax(360px,440px) 1fr;height:calc(100dvh - 60px - var(--st))}
.ed-form{background:var(--surf);border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.ed-prev{overflow:hidden;position:relative;display:flex;flex-direction:column}
.prev-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:12px;color:var(--ink2)}
.prev-bar .grow{flex:1}
.prev-scroll{flex:1;overflow:auto;padding:4px 16px 40px}
#prevFrame{margin:0 auto;position:relative}
#prev{transform-origin:0 0;position:absolute;left:0;top:0}

.sec{border-bottom:1px solid var(--line2)}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;font-weight:600;font-size:15px;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .hint{font-weight:400;color:var(--mute);font-size:13px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.sec>summary::after{content:"";width:8px;height:8px;border-right:1.8px solid var(--mute);border-bottom:1.8px solid var(--mute);transform:rotate(45deg);margin:-4px 2px 0 6px;transition:transform .15s}
.sec[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.sec .in{padding:0 18px 18px}
.row{display:grid;gap:10px;grid-template-columns:repeat(var(--c,2),minmax(0,1fr));margin-bottom:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span,.lbl{font-size:12px;font-weight:500;color:var(--ink2)}
.inp,.fld input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=range]),.fld select,.fld textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surf);outline:0;font-size:15px}
.fld textarea{min-height:84px;resize:vertical;line-height:1.45}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.help{font-size:12px;color:var(--mute);margin:4px 0 0}
.inline{display:flex;gap:6px;align-items:center}
.inline>*{flex:1}
.inline>.btn,.inline>select{flex:none}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;padding:6px 0}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:#C7CFDA;position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--acc)}
.switch input:checked::after{left:18px}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:13px;color:var(--ink2)}
.tbar .i{width:16px;height:16px;flex:none}
.tbar .tinfo{flex:1 1 180px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tbar .tinfo b{color:var(--ink)}
.tbar .tbtns{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tbar .tlbl{margin-right:2px}
.tbar .btn.sm{min-height:28px;padding:0 9px}
.tbar .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbar.warn{background:#FFF6D6;border-color:#F0D27A;color:var(--sig-ink)}
.tbar .btn.sug{background:var(--sig);border-color:#E0AC00;color:var(--sig-ink);font-weight:600}
.tbar .dim2{flex-basis:100%;font-size:12px;opacity:.85}
.item .tx .tag.lg{background:#FFF1C2;color:#6B5200}
.seg2{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg2 button{border:0;background:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink2)}
.seg2 button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(21,32,51,.15)}

/* capture bar — the core action */
.capture{background:var(--ink);border-radius:14px;padding:12px;color:#fff;margin-bottom:14px;position:relative}
.capture.drag{outline:3px dashed var(--sig);outline-offset:3px}
.capture textarea{width:100%;border:0;border-radius:9px;padding:11px 12px;min-height:66px;resize:vertical;background:#fff;color:var(--ink);outline:0;font-size:15px;line-height:1.4}
.capture textarea:focus{box-shadow:0 0 0 3px rgba(255,196,0,.55)}
.cap-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.cap-actions .btn.sig{flex:1 1 120px}.cap-actions .btn{padding:0 12px}
.cap-actions .btn.dark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.cap-actions .btn.dark:hover{background:rgba(255,255,255,.16)}
.cap-note{font-size:12px;color:#AEB8CA;margin:8px 2px 0}

.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surf)}
.item .th{width:58px;height:58px;border-radius:7px;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;color:var(--mute)}
.item .tx{min-width:0;cursor:pointer}
.item .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:13px;color:var(--ink2)}
.item .tx .tag{display:inline-block;font-size:11px;background:var(--acc-soft);color:var(--acc);border-radius:4px;padding:0 5px;margin-left:4px}
.item .op{display:flex;gap:0;align-items:center}
.items-empty{font-size:13px;color:var(--mute);padding:6px 2px}

.totbox{position:sticky;bottom:0;margin-top:auto;background:var(--surf);border-top:1px solid var(--line);padding:12px 18px calc(12px + var(--sb));display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;color:var(--ink2);z-index:2}
.totbox b{text-align:right;color:var(--ink)}
.totbox .g{font-size:18px;color:var(--ink);font-weight:700;margin-top:4px}
.totbox .g+b{font-size:18px;margin-top:4px;color:var(--acc)}

/* design panel */
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tpl{border:1.5px solid var(--line);border-radius:10px;background:var(--surf);padding:8px;cursor:pointer;text-align:center;font-size:13px;font-weight:500}
.tpl.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.tpl i{display:block;height:52px;border-radius:5px;margin-bottom:6px;background:#fff;border:1px solid var(--line2);position:relative;overflow:hidden}
.tpl i::before,.tpl i::after{content:"";position:absolute;left:8px;right:8px}
.tpl.moderno i::before{top:0;left:0;right:0;height:14px;background:var(--pc,#1E4FD8)}
.tpl.moderno i::after{top:22px;height:22px;background:repeating-linear-gradient(#DDE3EA 0 3px,transparent 3px 7px)}
.tpl.klasik i::before{top:7px;left:30%;right:30%;height:4px;background:#1d2433;box-shadow:0 7px 0 -1px #C7CEDA}
.tpl.klasik i::after{top:24px;height:20px;border-top:1px solid #1d2433;background:repeating-linear-gradient(#E3E7EE 0 1px,transparent 1px 5px)}
.tpl.minimal i::before{top:8px;width:40%;height:6px;background:#1d2433;right:auto}
.tpl.minimal i::after{top:26px;height:16px;background:repeating-linear-gradient(#EDF0F4 0 2px,transparent 2px 7px)}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.swatches input[type=color]{width:34px;height:34px;border:0;background:none;padding:0;cursor:pointer}
.imgpick{display:flex;gap:10px;align-items:center}
.imgpick .pv{width:84px;height:56px;border-radius:7px;border:1px solid var(--line);background:var(--soft) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--mute);font-size:11px}
.imgpick .col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
input[type=range]{width:100%;accent-color:var(--acc)}
.sub{font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--ink)}

/* mobile segmented */
.mseg{display:none}

/* ============ SHEET (import / item) ============ */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet-back{position:absolute;inset:0;background:rgba(14,22,36,.55)}
.sheet-card{position:relative;background:var(--surf);border-radius:18px;width:min(1120px,100%);max-height:calc(100dvh - 40px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.sh-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.sh-head h2{margin:0;font-size:18px;white-space:nowrap}
.sh-head .src{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.sh-body{display:grid;grid-template-columns:1.25fr 1fr;min-height:0;flex:1;overflow:hidden}
.sh-media{overflow-y:auto;padding:16px 18px;background:var(--soft);border-right:1px solid var(--line2)}
.sh-form{overflow-y:auto;padding:16px 18px}
.sh-foot{display:flex;align-items:center;gap:8px;padding:12px 18px calc(12px + var(--sb));border-top:1px solid var(--line2)}
.sh-foot .grow{flex:1;font-size:13px;color:var(--ink2)}
.sh-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sh-tools .t{font-weight:600;margin-right:auto}
.sh-tools .t small{font-weight:400;color:var(--mute)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);cursor:pointer;padding:0}
.tile img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.tile.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc)}
.tile .badge{position:absolute;top:6px;left:6px;min-width:24px;height:24px;border-radius:12px;background:rgba(255,255,255,.92);border:1.5px solid #B9C2CF;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.tile.on .badge{background:var(--acc);border-color:var(--acc);color:#fff}
.tile .main{position:absolute;bottom:6px;left:6px;font-size:11px;background:var(--ink);color:#fff;border-radius:4px;padding:1px 6px}
.tile .dim{position:absolute;bottom:6px;right:6px;font-size:10px;color:var(--ink2);background:rgba(255,255,255,.9);border-radius:4px;padding:0 4px}
.tile.tiny{display:none}
.pgrid.showtiny .tile.tiny{display:block}
.tile.broken{display:none}
.skel{aspect-ratio:1;border-radius:10px;background:linear-gradient(90deg,#E4E8EE 25%,#EEF1F5 50%,#E4E8EE 75%);background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.sh-status{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.sh-status.load{background:var(--acc-soft);color:var(--acc)}
.sh-status.err{background:#FBEAE8;color:#8E2A22}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none;margin-top:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.vlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.vrow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
.vrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow input{accent-color:var(--acc)}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.pchip{border:1px dashed #9FB0CC;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:3px 8px;font-size:13px;cursor:pointer;font-weight:500}
.calc{background:var(--soft);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px;color:var(--ink2);margin-top:6px}
.calc b{text-align:right;color:var(--ink);font-weight:600}
.calc .big{font-size:16px;color:var(--ink);font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:3px}
.calc .big+b{font-size:16px;border-top:1px solid var(--line);padding-top:6px;margin-top:3px;color:var(--acc)}
.dropzone{border:1.5px dashed #AEB8C6;border-radius:10px;padding:14px;text-align:center;color:var(--ink2);font-size:13px;margin-top:10px}
.sheet.drag .dropzone{border-color:var(--acc);background:var(--acc-soft)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + var(--sb));transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 24px))}
.tst{background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;pointer-events:auto;max-width:100%}
.tst.err{background:#8E2A22}
.tst button{background:var(--sig);color:var(--sig-ink);border:0;border-radius:6px;padding:6px 10px;font-weight:600;cursor:pointer}
.busy{position:fixed;inset:0;z-index:90;background:rgba(255,255,255,.7);display:grid;place-items:center}
.busy div{background:var(--ink);color:#fff;padding:14px 18px;border-radius:12px;display:flex;gap:10px;align-items:center}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h2{font-size:17px;margin:0 0 4px}
.panel>p{margin:0 0 14px;color:var(--ink2);font-size:13px}
.kv{font-size:13px;color:var(--ink2);margin:8px 0}

.sheet-card.narrow.mid{width:min(760px,100%)}
.md-body{padding:16px 18px;overflow-y:auto;overscroll-behavior:contain}
.search.wide{max-width:none;width:100%}
.mini{display:flex;flex-direction:column;gap:6px;max-height:min(56vh,520px);overflow-y:auto}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px}
.mrow:hover{border-color:#AEB8C6;background:var(--soft)}
.mrow>span:first-child{flex:1;min-width:0}
.mrow small{color:var(--ink2)}
.mrow.pick input{width:18px;height:18px;flex:none;accent-color:var(--acc)}
.mrow.pick.on{border-color:var(--acc);background:var(--acc-soft)}
.mrow .im{width:44px;height:44px;border-radius:6px;background:var(--soft) center/cover no-repeat;flex:none}
.mrow .grow{flex:1;min-width:0}
/* tables (customers, price list) */
.tbl{background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl .tr,.tbl .th-row{display:grid;align-items:center;gap:14px;padding:10px 14px;border-top:1px solid var(--line2)}
.tbl .th-row{border-top:0;font-size:12px;font-weight:600;color:var(--ink2);background:var(--soft)}
.tbl .tr:first-child{border-top:0}
.tbl .tr{cursor:pointer}
.tbl .tr:hover{background:#FAFBFD}
.tbl .c1{min-width:0}
.tbl .c1 b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .c1 span,.tbl .c2,.tbl .c3{font-size:13px;color:var(--ink2)}
.tbl .r{text-align:right;white-space:nowrap}
.tbl.cu .tr{grid-template-columns:40px minmax(0,1.4fr) minmax(0,1.3fr) 130px auto}
.tbl.cu .av{width:40px;height:40px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:700}
.tbl.cu .c2{display:flex;flex-direction:column;gap:2px;min-width:0}
.tbl.cu .c2 a{display:flex;align-items:center;gap:6px;color:var(--ink2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl.cu .c2 a:hover{color:var(--acc)}
.tbl.cu .c2 .i{width:14px;height:14px}
.tbl.cu .c3 b{color:var(--ink)}
.tbl.cu .c3 span{display:block}
.tbl.pr .tr,.tbl.pr .th-row{grid-template-columns:48px minmax(0,1fr) 160px 110px 110px}
.tbl.pr .im{width:48px;height:48px;border-radius:7px;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;color:var(--mute)}
.prgrid{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.primg{width:96px;height:96px;border-radius:10px;border:1px solid var(--line);background:var(--soft) center/contain no-repeat;display:grid;place-items:center;color:var(--mute);flex:none}
/* to-do */
.tadd{display:flex;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:8px}
.tadd input{border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:40px;background:var(--surf)}
.tadd #tdText{flex:1;min-width:0}
.tadd #tdDue{width:150px}
.tgrp{margin-top:18px}
.tgrp h3{font-size:13px;text-transform:uppercase;color:var(--ink2);margin:0 0 8px;font-weight:600}
.tgrp h3 small{color:var(--mute);font-weight:500}
.tgrp.late h3{color:var(--bad)}
.todo{display:flex;align-items:flex-start;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 12px;margin-bottom:6px}
.todo.hi{border-left:4px solid var(--sig)}
.todo .tick{width:24px;height:24px;border-radius:50%;border:2px solid #AEB8C6;background:var(--surf);display:grid;place-items:center;cursor:pointer;flex:none;margin-top:1px;color:#fff;padding:0}
.todo .tick:hover{border-color:var(--ok)}
.todo.done .tick{background:var(--ok);border-color:var(--ok)}
.todo .tick .i{width:14px;height:14px;stroke-width:3}
.todo .tx{flex:1;min-width:0;cursor:pointer}
.todo .tx b{font-weight:500;display:block}
.todo.done .tx b{text-decoration:line-through;color:var(--mute)}
.todo .nt{display:block;font-size:13px;color:var(--ink2);white-space:pre-line}
.todo .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-size:12px;color:var(--ink2)}
.todo .meta>*{display:inline-flex;align-items:center;gap:4px}
.todo .meta .i{width:13px;height:13px}
.todo .meta a{color:var(--acc);cursor:pointer}
.todo .due.late{color:var(--bad);font-weight:600}
.todo .due.today{color:var(--acc);font-weight:600}
.todo .pri{background:#FFF1C2;color:#6B5200;border-radius:4px;padding:0 6px}
/* company */
.comp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:16px;align-items:start}
.comp-col{display:flex;flex-direction:column;gap:16px}
.comp-col .panel h2,.comp-prev .panel h2{display:flex;align-items:center}
.sticky{position:sticky;top:16px}
.cpv{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#fff}
.cpv .doc{position:absolute;left:0;top:0}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--acc)}
.phs{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.phs .pchip{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.logo-prev span{display:grid;place-items:center;height:100%;color:var(--mute);font-size:13px}
/* dashboard */
.dash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{text-align:left;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:hover{border-color:#AEB8C6}
.kpi span{font-size:13px;color:var(--ink2)}
.kpi b{font-size:26px;line-height:1.1}
.kpi small{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.warn{border-color:#F0C4BF;background:#FDF3F2}
.kpi.warn b{color:var(--bad)}
.cap-actions{flex-wrap:wrap}
@media (max-width:1100px){.comp-grid{grid-template-columns:1fr}.sticky{position:static}.comp-prev{order:-1}.cpv{max-width:420px}}
@media (max-width:900px){
  body:not(.editing) #toast{bottom:calc(78px + var(--sb))}
  html{scroll-padding-bottom:150px;scroll-padding-top:70px}
  body{padding-left:0;padding-bottom:calc(64px + var(--sb))}
  .nav{top:auto;right:0;width:auto;height:calc(64px + var(--sb));flex-direction:row;padding:4px 4px var(--sb);gap:0;overflow:visible;border-top:1px solid #0d1626}
  .nav .brand,.nav .sp,.nav [data-nav=settings]{display:none}
  .nav a{flex:1;flex-direction:column;gap:3px;font-size:11px;padding:7px 2px;justify-content:center;border-radius:10px}
  .nav a .badge{position:absolute;top:2px;right:calc(50% - 22px);padding:0 5px;font-size:10px}
  body.editing{padding-left:0;padding-bottom:0}
  body.editing .nav{display:none}
  .sticky{top:auto}
  .tbl.cu .tr{grid-template-columns:40px minmax(0,1fr) auto}
  .tbl.cu .c2,.tbl.cu .c3{display:none}
  .tbl.pr .tr,.tbl.pr .th-row{grid-template-columns:44px minmax(0,1fr) 96px}
  .hide-s{display:none!important}
  .dash{grid-template-columns:1fr 1fr}
  .dash .kpi:last-child{grid-column:1/-1}
  .kpi b{font-size:22px}
  .tadd{flex-wrap:wrap}
  .tadd #tdText{flex:1 1 100%}
  .tadd #tdDue{flex:1}
}
@media (min-width:901px){body:not(.editing):not(.detail) .top{display:none}}
@media (max-width:900px){.list-head h1{display:none}.list-head{margin-bottom:12px}}
@media print{body{padding:0!important}.nav{display:none!important}}
</style>

    l.split(/(?<=[.!?;:])\s+/).forEach((p,j)=>{for(let k=0;k<p.length;k+=lim)segs.push([k?'':j?' ':sep,p.slice(k,k+lim)])})});
  const ch=[];let c=null;for(const [sep,s] of segs){if(c&&c.t.length+sep.length+s.length<=lim)c.t+=sep+s;else{c={sep,t:s};ch.push(c)}}return ch;
}
function decodeEnt(s){const d=document.createElement('textarea');d.innerHTML=s;return d.value}
async function trGoogle(t,tl,sl){
  const u=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(t)}`;
  let j;try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),12000);const r=await fetch(u,{credentials:'omit',signal:ctl.signal});clearTimeout(tm);if(!r.ok)throw new Error('HTTP '+r.status);j=await r.json()}
  catch(e){j=(await fetchVia(u,'json',12000)).body}
  if(!Array.isArray(j)||!Array.isArray(j[0]))throw new Error('nepričakovan odgovor');
  return{text:j[0].map(x=>x&&x[0]||'').join(''),src:j[2]||sl};
}
async function trMyMemory(t,tl,sl){
  const s=sl==='auto'?(detectLang(t)||'en'):sl;if(s===tl)return{text:t,src:s};
  const em=S.settings.company?.email;
  const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${s}|${tl}${em?'&de='+encodeURIComponent(em):''}`,{credentials:'omit'});
  const j=await r.json();if(+j.responseStatus!==200)throw new Error(j.responseDetails||'MyMemory napaka');
  return{text:decodeEnt(j.responseData.translatedText||''),src:s};
}
async function trDeepL(texts,tl,sl){
  const px=(S.settings.proxy||'').trim().replace(/\/+$/,'');if(!px)throw new Error('za DeepL vpiši naslov lastnega posrednika (Cloudflare Worker)');
  const TL=tl==='en'?'EN-GB':tl.toUpperCase();
  const r=await fetch(px+'/deepl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:texts,target_lang:TL,source_lang:sl&&sl!=='auto'?sl.split('-')[0].toUpperCase():undefined,key:(S.settings.deeplKey||'').trim()||undefined})});
  let j;try{j=await r.json()}catch{throw new Error('posrednik ne podpira DeepL — posodobi worker.js')}
  if(!r.ok)throw new Error(j.message||('HTTP '+r.status));
  return j.translations.map(x=>({text:x.text,src:(x.detected_source_language||'').toLowerCase()}));
}
async function trOne(text,tl,sl,prov){
  const m=String(text).match(/^(\s*)([\s\S]*?)(\s*)$/);if(!m[2])return{text,src:sl};
  const fn=prov==='mymemory'?trMyMemory:trGoogle,lim=prov==='mymemory'?450:1400;
  let src=sl,out='';
  for(const c of chunkText(m[2],lim)){
    if(!c.t.trim()){out+=c.sep+c.t;continue}
    const lead=c.t.match(/^\s*/)[0],trail=c.t.match(/\s*$/)[0];
    let r;try{r=await fn(c.t.trim(),tl,sl)}catch(e){if(prov==='mymemory')throw e;r=await trMyMemory(c.t.trim(),tl,sl==='auto'?(detectLang(m[2])||'auto'):sl)}
    if(r.src&&src==='auto')src=r.src;out+=c.sep+lead+r.text+trail;
  }
  return{text:m[1]+out+m[3],src};
}
/** translate array of texts → [{text,src}] */
async function translateTexts(texts,tl,sl='auto'){
  const prov=S.settings.trProvider||'google',P=texts.map(protect);
  if(prov==='deepl'){
    try{const idx=P.map((p,i)=>p.t.trim()?i:-1).filter(i=>i>=0);const res=texts.map(t=>({text:t,src:sl}));
      if(idx.length){const r=await trDeepL(idx.map(i=>P[i].t),tl,sl);idx.forEach((i,k)=>res[i]={text:unprotect(r[k].text,P[i]),src:r[k].src})}
      return res}
    catch(e){toast('DeepL: '+e.message+' — uporabljam Google.','err',6000)}
  }
  const out=[];
  for(let i=0;i<P.length;i++){const r=await trOne(P[i].t,tl,sl,prov==='deepl'?'google':prov);out.push({text:unprotect(r.text,P[i]),src:r.src})}
  return out;
}

/** guess the currency of a product page */
function detectCurrency(doc,html,base,ldCurs=[]){
  const sc={},add=(c,w)=>{c=String(c||'').toUpperCase().trim();if(CURS.includes(c))sc[c]=(sc[c]||0)+w};
  ldCurs.forEach(c=>add(c,10));
  ['product:price:currency','og:price:currency','twitter:data2'].forEach(k=>{const e=doc.querySelector(`meta[property="${k}"],meta[name="${k}"]`);e&&add(e.getAttribute('content'),10)});
  doc.querySelectorAll('[itemprop="priceCurrency"]').forEach(e=>add(e.getAttribute('content')||e.textContent,8));
  let m=html.match(/Shopify\.currency\s*=\s*\{\s*"active"\s*:\s*"([A-Z]{3})"/);if(m)add(m[1],12);
  (html.match(/"(?:priceCurrency|currencyCode|currency_code|currency)"\s*:\s*"([A-Z]{3})"/g)||[]).slice(0,20).forEach(s=>add(s.slice(-4,-1),2));
  (html.match(/data-currency(?:-code)?=["']([A-Z]{3})["']/g)||[]).slice(0,10).forEach(s=>add(s.slice(-4,-1),2));
  const txt=(doc.body?.textContent||'').replace(/\s+/g,' ').slice(0,200000);
  const host=(()=>{try{return new URL(base).hostname}catch{return ''}})(),tld=host.split('.').pop();
  for(const [c,tok] of Object.entries(CUR_TOK)){
    const re=new RegExp(`(?:^|[^A-Za-z])(?:${tok})\\s?\\d|\\d[\\d.,\\s]*\\s?(?:${tok})(?![A-Za-z])`,'g');
    const n=Math.min(6,(txt.match(re)||[]).length);if(!n)continue;
    if(c==='SEK'||c==='NOK'||c==='DKK'){if(({SEK:'se',NOK:'no',DKK:'dk'})[c]!==tld)continue}
    if(c==='CNY'&&tld!=='cn')continue;
    if(c==='USD'&&/(?:A|AU|C|CA|NZ|HK|S)\$/.test(txt)&&!/US\$|USD/.test(txt))continue;
    add(c,n);
  }
  const TLD={uk:'GBP',ch:'CHF',pl:'PLN',cz:'CZK',hu:'HUF',se:'SEK',no:'NOK',dk:'DKK',ro:'RON',bg:'BGN',tr:'TRY',jp:'JPY',cn:'CNY',au:'AUD',ca:'CAD',us:'USD'};
  if(TLD[tld])add(TLD[tld],1.5);
  if(/\.co\.uk$/.test(host))add('GBP',1.5);
  const best=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
  return best?best[0]:'EUR';
}

function isoAdd(d,days){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+days);return x.toISOString().slice(0,10)}
function bsParse(xml,date){
  const re=/<tecajnica datum="(\d{4}-\d\d-\d\d)">([\s\S]*?)<\/tecajnica>/g;let m,best=null;
  while((m=re.exec(xml))){if(m[1]<=date&&(!best||m[1]>best[0]))best=[m[1],m[2]]}
  if(!best)return null;
  const rates={};best[1].replace(/oznaka="([A-Z]{3})"[^>]*>([\d.]+)</g,(_,c,v)=>{rates[c]=+v});
  return{date:best[0],rates,src:'bs'};
}
async function bsRates(date){
  const t=today(),d=date>t?t:date;
  if(d>=isoAdd(t,-5)){
    try{const {body}=await fetchVia('https://www.bsi.si/_data/tecajnice/dtecbs.xml','text',12000);const r=bsParse(body,d);if(r&&r.date>=isoAdd(d,-4))return r}catch{}
  }
  // ECB reference rates are exactly the rates Banka Slovenije publishes (dnevna tečajnica = referenčni tečaji ECB)
  try{const r=await fetch(`https://api.frankfurter.dev/v1/${d}?base=EUR`,{credentials:'omit'});if(r.ok){const j=await r.json();if(j&&j.rates)return{date:j.date,rates:j.rates,src:'bs'}}}catch{}
  try{const r=await fetch(`https://api.frankfurter.app/${d}?from=EUR`,{credentials:'omit'});if(r.ok){const j=await r.json();if(j&&j.rates)return{date:j.date,rates:j.rates,src:'bs'}}}catch{}
  const {body}=await fetchVia('https://www.bsi.si/_data/tecajnice/dtecbs-l.xml','text',45000);
  const r=bsParse(body,d);if(!r)throw new Error('tečaja za ta datum ni');return r;
}
async function otpRates(){
  const kind=S.settings.fxOtpKind||'prodajni';
  const {body}=await fetchVia('https://www.otpbanka.si/tecajne-liste-menjalnica?currencyexchangetypeid=2','text',15000);
  const doc=new DOMParser().parseFromString(body,'text/html');const rates={};
  doc.querySelectorAll('table').forEach(tb=>{
    const heads=[...tb.querySelectorAll('thead th, tr:first-child th, tr:first-child td')].map(x=>x.textContent.trim().toLowerCase());
    const col=k=>heads.findIndex(h=>h.includes(k));
    const iS=col(kind==='srednji'?'sred':'prodaj'),iU=col('enot');
    tb.querySelectorAll('tr').forEach(tr=>{
      const cells=[...tr.children].map(x=>x.textContent.replace(/\s+/g,' ').trim());
      const code=cells.find(x=>/^[A-Z]{3}$/.test(x));if(!code||code==='EUR'||!CURS.includes(code))return;
      const nums=cells.map((x,i)=>[i,x]).filter(([,x])=>/^\d{1,6}([.,]\d+)?$/.test(x)&&/[.,]/.test(x));
      let v=iS>=0&&cells[iS]?num(cells[iS]):0;
      if(!v&&nums.length)v=num(kind==='srednji'&&nums.length>=3?nums[Math.floor(nums.length/2)][1]:nums[nums.length-1][1]);
      const unit=iU>=0?num(cells[iU])||1:1;
      if(v>0)rates[code]=v/unit;
    });
  });
  if(!Object.keys(rates).length)throw new Error('tečajnice OTP banke ni bilo mogoče prebrati');
  const dm=(doc.body.textContent||'').match(/(\d{1,2})\.\s?(\d{1,2})\.\s?(20\d\d)/);
  const date=dm?`${dm[3]}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`:today();
  return{date,rates,src:'otp',kind};
}
/** rate for 1 EUR in `cur` on `date` from source `src` (bs|otp) */
async function fxGet(cur,date,src){
  src=src||S.settings.fxSrc||'bs';date=date||today();
  if(!cur||cur==='EUR')return{rate:1,date,src};
  const key=src==='otp'?`otp|${today()}|${S.settings.fxOtpKind||'prodajni'}`:`bs|${date>today()?today():date}`;
  let t=FX[key];
  if(!t){
    try{t=src==='otp'?await otpRates():await bsRates(date)}
    catch(e){if(src==='otp'){toast('OTP banka: '+e.message+' – uporabljam tečaj Banke Slovenije.','err',7000);return fxGet(cur,date,'bs')}throw e}
    if(key.startsWith('bs|')&&key.slice(3)<today())FX[key]=t;else FX[key]={...t};fxSaveCache();
  }
  const r=t.rates[cur];if(!r)throw new Error(`za valuto ${cur} ni tečaja`);
  return{rate:r,date:t.date,src:t.src,kind:t.kind||''};
}
/** recalculate all foreign-currency items of a quote to the quote date */
async function recalcFx(q,silent){
  const its=q.items.filter(it=>it.fx&&it.fx.cur&&it.fx.cur!=='EUR'&&it.fx.src!=='rocno');if(!its.length)return 0;
  let n=0;
  for(const it of its){try{const r=await fxGet(it.fx.cur,q.date,it.fx.src);const vat=itemVat(it,q),p=+it.fx.price||0,eur=p/r.rate;
    it.net=Math.round((it.fx.hasVat?eur/(1+vat/100):eur)*10000)/10000;Object.assign(it.fx,{rate:r.rate,date:r.date,src:r.src,kind:r.kind});n++}catch(e){if(!silent)toast(`${it.title||'Izdelek'}: ${e.message}`,'err',6000)}}
  return n;
}

/* ================= calculations ================= */
function itemVat(it,q){return it.vat==null||it.vat===''?+q.vat:+it.vat}
function lineCalc(it,q){
  const net=+it.net||0,qty=+it.qty||0,disc=+it.disc||0,rate=itemVat(it,q);
  const base=net*qty,dnet=r2(base*(1-disc/100)),vat=r2(dnet*rate/100);
  return{unitNet:net,unitGross:net*(1+rate/100),base:r2(base),net:dnet,discAmt:r2(base-dnet),vat,gross:r2(dnet+vat),rate};
}
function totals(q){
  let net=0,disc=0;const vats={};
  allLines(q).forEach(it=>{const c=lineCalc(it,q);net+=c.net;disc+=c.discAmt;vats[c.rate]=(vats[c.rate]||0)+c.vat});
  net=r2(net);const vat=r2(Object.values(vats).reduce((a,b)=>a+b,0)),gross=r2(net+vat);
  const avans=q.avansType==='%'?r2(gross*(num(q.avans))/100):r2(num(q.avans));
  return{net,disc:r2(disc),vats,vat,gross,avans};
}
function validUntil(q){const d=new Date(q.date);if(isNaN(d))return '';d.setDate(d.getDate()+(parseInt(q.validDays)||0));return dateSl(d)}

}

function inlineMd(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function richText(t){
  const lines=String(t||'').replace(/\r/g,'').split('\n');let out='',list=[],para=[];
  const flushP=()=>{if(para.length){out+=`<p>${para.map(inlineMd).join('<br>')}</p>`;para=[]}};
  const flushL=()=>{if(list.length){out+=`<ul>${list.map(l=>`<li>${inlineMd(l)}</li>`).join('')}</ul>`;list=[]}};
  for(const raw of lines){const l=raw.trim();const m=l.match(/^[•\-\*–✓✔]\s*(.+)/);
    if(m){flushP();list.push(m[1])}else if(!l){flushP();flushL()}else{flushL();para.push(l)}}
  flushP();flushL();return out;
}
function htmlToText(h){
  if(!h)return '';
  let s=String(h).replace(/<(script|style)[\s\S]*?<\/\1>/gi,'').replace(/<br\s*\/?>/gi,'\n').replace(/<li[^>]*>/gi,'\n• ').replace(/<\/(p|div|h\d|li|tr|ul|ol)>/gi,'\n').replace(/<(p|div|h\d|ul|ol|tr)[^>]*>/gi,'\n');
  const d=new DOMParser().parseFromString(s,'text/html');
  return (d.body.textContent||'').replace(/[ \t\u00a0]+/g,' ').split('\n').map(x=>x.trim()).join('\n').replace(/\n{3,}/g,'\n\n').replace(/\n+(?=• )/g,'\n').replace(/^\n+|\n+$/g,'');
}

const DIM={};
const MM=96/25.4;
function imgDims(src){return new Promise(res=>{if(!src)return res(null);if(DIM[src])return res(DIM[src]);const i=new Image();i.onload=()=>{DIM[src]=[i.naturalWidth||4,i.naturalHeight||3];res(DIM[src])};i.onerror=()=>{DIM[src]=[4,3];res(DIM[src])};i.src=src})}
async function ensureDims(q){
  const c=S.settings.company||{},d=q.design||{},list=[c.logo,d.coverBg,d.pageBg];
  q.items.forEach(it=>(it.images||[]).slice(0,5).forEach(s=>list.push(s)));

async function fontsReady(q){try{if(document.fonts){const f=(q.design||{}).font||'Onest';await Promise.race([Promise.all([document.fonts.load(`400 10pt '${f}'`),document.fonts.load(`700 10pt '${f}'`)]),sleep(2500)]);await Promise.race([document.fonts.ready,sleep(2500)])}}catch{}}
function fit(src,mw,mh){
  const d=DIM[src]||[4,3];let w=mw,h=mw*d[1]/d[0];if(h>mh){h=mh;w=mh*d[0]/d[1]}
  const cap=d[0]/3.4;if(w>cap&&cap>12){const k=cap/w;w*=k;h*=k}   // do not blow small pictures up beyond ~85 dpi
  return{w:+w.toFixed(2),h:+h.toFixed(2)};
}
function imgTag(src,mw,mh,word){if(!src)return '';const f=fit(src,mw,mh);
  return word?`<img src="${esc(src)}" width="${Math.round(f.w*MM)}" height="${Math.round(f.h*MM)}" alt="">`:`<img src="${esc(src)}" style="width:${f.w}mm;height:${f.h}mm" alt="">`}
function logoHTML(c,mw,mh,word){
  if(!c.logo)return `<span class="wm">${esc(c.name||'')}</span>`;
  const k=Math.min(1.7,Math.max(.7,(+c.logoScale||120)/100));
  const im=imgTag(c.logo,Math.min(mw*k,120),mh*k,word);
  return c.logoLight&&!word?`<span class="lplate">${im}</span>`:im;
}
function descBlocks(t){
  const html=richText(t);if(!html)return [];
  const box=document.createElement('div');box.innerHTML=html;const out=[];
  [...box.children].forEach(el=>{
    if(el.tagName==='UL'){const lis=[...el.children];lis.forEach((li,k)=>out.push(`<div class="desc${k===lis.length-1?' ul-end':''}"><ul><li>${li.innerHTML}</li></ul></div>`))}
    else{const lines=el.innerHTML.split(/<br\s*\/?>/i);if(lines.length>6)lines.forEach((l,k)=>out.push(`<div class="desc${k===lines.length-1?'':' pl'}"><p>${l}</p></div>`));else out.push(`<div class="desc"><p>${el.innerHTML}</p></div>`)}
  });

}

/* ---------- pagination ---------- */
let MHOST=null;
function measureHost(){if(!MHOST){MHOST=document.createElement('div');MHOST.setAttribute('aria-hidden','true');MHOST.style.cssText='position:absolute;left:-40000px;top:0;visibility:hidden;pointer-events:none;contain:layout';document.body.appendChild(MHOST)}return MHOST}
const blkHTML=b=>`<div class="blk${b.cls?' '+b.cls:''}">${b.html}</div>`;
function paginate(M){
  const host=measureHost();
  const alts=[];M.blocks.forEach(b=>b.alt&&alts.push(...b.alt));
  const theads=[...new Set(M.blocks.filter(b=>b.thead).map(b=>b.thead))].map(h=>B(h));
  const rh=B(M.runHead);
  const list=[...M.blocks,...alts,...theads,rh];
  host.innerHTML=`<div class="${M.cls}" style="${M.style}"><section class="page pc"><div class="pin" style="height:auto">${list.map(blkHTML).join('')}</div></section><section class="page pc"><div class="pin"></div></section></div>`;
  const pins=host.querySelectorAll('.pin'),els=pins[0].children;
  list.forEach((b,i)=>b.h=els[i].getBoundingClientRect().height);
  const avail=pins[1].getBoundingClientRect().height-1.5,fresh=avail-rh.h;
  const thH=new Map(theads.map(t=>[t.html,t.h]));
  host.innerHTML='';
  const seq=[];M.blocks.forEach(b=>{if(b.alt&&b.h>fresh){b.alt[0].breakBefore=b.breakBefore;seq.push(...b.alt)}else seq.push(b)});
  const pages=[];let pg,used;
  const newPage=()=>{pg=[];pages.push(pg);used=pages.length>1?rh.h:0};
  newPage();
  for(let i=0;i<seq.length;i++){
    if(seq[i].breakBefore&&pg.length)newPage();
    if(seq[i].alt&&pg.length&&used+seq[i].h>avail&&avail-used>avail*.3){const a=seq[i].alt;seq.splice(i,1,...a);if(!a[0].breakBefore)a[0].breakBefore=false}
    let j=i,gh=seq[i].h;while(seq[j].keepNext&&j+1<seq.length&&!seq[j+1].breakBefore){j++;gh+=seq[j].h}
    if(pg.length&&used+gh>avail&&gh<=fresh)newPage();
    for(let k=i;k<=j;k++){
      const x=seq[k];
      if(pg.length&&used+x.h>avail)newPage();
      if(!pg.length&&x.thead&&k>0&&(seq[k-1].thead===x.thead||seq[k-1].cls==='sumh')){pg.push(B(x.thead));used+=thH.get(x.thead)||0}
      pg.push(x);used+=x.h;
    }
    i=j;
  }
  return pages.filter(p=>p.length);
}
function buildDoc(q,mode){
  const M=docModel(q,mode);
  if(mode==='html')return `<div class="${M.cls}" style="${M.style}">${M.cover}<section class="page pc">${M.blocks.map(blkHTML).join('')}${M.foot(0,0)}</section></div>`;
  const pages=paginate(M),n=pages.length;
  return `<div class="${M.cls}" style="${M.style}">${M.cover}${pages.map((pg,pi)=>`<section class="page pc${pi===0?' p1':''}"><div class="topbar"></div>${M.pgbg}<div class="pin">${pi>0?M.runHead:''}${pg.map(blkHTML).join('')}</div>${M.foot(pi+1,n)}</section>`).join('')}</div>`;
}

        allLines(q).map((it,i)=>{const L=lineCalc(it,q);return `<tr><td ${td}>${it.x?'':i+1}</td><td ${td}>${esc(it.title||'')}</td><td ${tdr}>${fmtN(it.qty,3)} ${esc(unitL(it.unit||''))}</td><td ${tdr}>${fmt(gross?L.unitGross:L.unitNet)}</td><td ${tdr}>${+it.disc?fmtN(it.disc)+' %':'—'}</td><td ${tdr}>${fmt(gross?L.gross:L.net)}</td></tr>`}).join('')+`</table>`;

    return h;
  }finally{LOC=pl;DLX=pd;DLANG=pg}
}
async function ensureQRs(q){
  const need=q.items.map(i=>i.video&&i.video.src).filter(s=>s&&!s.startsWith('data:')&&!QR[s]);
  if(!need.length||!(q.design||{}).qr)return false;
  try{await loadScript(CDN.qr)}catch{return false}
  for(const s of need){try{const div=document.createElement('div');new QRCode(div,{text:s,width:256,height:256,correctLevel:QRCode.CorrectLevel.M});const cv=div.querySelector('canvas');QR[s]=cv?cv.toDataURL('image/png'):(div.querySelector('img')||{}).src||''}catch{}}
  return true;
}

/* ================= fetching & parsing any web page ================= */
async function fetchVia(url,as='text',timeout=15000){
  const enc=encodeURIComponent(url),list=[];
  if(S.settings.proxy)list.push(S.settings.proxy.trim().replace(/\/+$/,'')+'/?url='+enc);
  list.push(url);
  list.push('https://api.allorigins.win/raw?url='+enc,'https://corsproxy.io/?url='+enc,'https://api.codetabs.com/v1/proxy/?quest='+enc);
  let last;
  for(const u of list){
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),u===url?7000:timeout);
    try{
      const r=await fetch(u,{signal:ctl.signal,credentials:'omit'});clearTimeout(t);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const final=r.headers.get('X-Final-URL')||url;
      let body;
      if(as==='blob'){body=await r.blob();if(!/^image\//.test(body.type)&&body.size<200)throw new Error('ni slika')}
      else if(as==='json'){body=await r.json()}
      else{body=await r.text();if(body.length<40)throw new Error('prazen odgovor')}
      return{body,final};
    }catch(e){clearTimeout(t);last=e.name==='AbortError'?new Error('predolgo čakanje'):e}
  }
  throw last||new Error('ni dostopa');
}
function bestSrcset(ss){if(!ss)return '';let best='',bw=0;ss.split(/,\s+(?=\S)/).forEach(p=>{const [u,w]=p.trim().split(/\s+/);const n=parseFloat(w)||1;if(n>=bw){bw=n;best=u}});return best}
function normImg(u){

function blobToImage(blob,max=1600,q=.86){

async function sheetTranslate(tl){

async function translateQuote(tl){
  const q=cur;if(!q)return;
  const jobs=[];
  q.items.forEach(it=>{const lg=it.lang||detectLang(it.title+'\n'+it.desc);if(lg!==tl&&(it.title||it.desc))jobs.push({type:'item',it,lg})});
  const fields=[['title','Naslov'],['rok','Rok dobave'],['intro','Uvod'],['note','Opomba']].filter(([k])=>q[k]&&q[k].trim()&&detectLang(q[k])!==tl);

}

async function saveOut(name,mime,produce){
  // 1) default folder (Chrome/Edge on Windows, macOS, ChromeOS)
  if(S.dir){try{let p=await S.dir.queryPermission({mode:'readwrite'});if(p!=='granted')p=await S.dir.requestPermission({mode:'readwrite'});if(p==='granted'){const blob=await produce();if(!blob)return;const fh=await S.dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();toast(`Shranjeno v mapo »${S.dir.name}«: ${name}`);return true}}catch(e){console.warn(e)}}
  // 2) save dialog
  if(window.showSaveFilePicker&&!isCoarse()){
    let fh;try{const ext=name.split('.').pop();fh=await showSaveFilePicker({suggestedName:name,types:[{description:ext.toUpperCase(),accept:{[mime]:['.'+ext]}}]})}catch(e){if(e.name==='AbortError')return false}
    if(fh){const blob=await produce();if(!blob)return;const w=await fh.createWritable();await w.write(blob);await w.close();toast(`Shranjeno: ${name}`);return true}
  }
  const blob=await produce();if(!blob)return;
  // 3) phones/tablets: share sheet (Files, Drive, e-pošta …)
  const file=new File([blob],name,{type:mime});
  if(isCoarse()&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return true}
    catch(e){if(e.name==='AbortError')return false;toast(`${name} je pripravljen.`,'',15000,{label:'Shrani / deli',fn:()=>navigator.share({files:[file],title:name}).catch(()=>download(blob,name))});return true}
  }
  download(blob,name);return true;
}

async function processLogo(src){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('neveljavna slika'));i.src=src});
  let W=img.naturalWidth||img.width||600,H=img.naturalHeight||img.height||200;const k=Math.min(1,1600/Math.max(W,H));W=Math.max(1,Math.round(W*k));H=Math.max(1,Math.round(H*k));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.drawImage(img,0,0,W,H);
  let d;try{d=x.getImageData(0,0,W,H).data}catch{return{logo:cv.toDataURL('image/png'),light:false}}
  const px=i=>[d[i],d[i+1],d[i+2],d[i+3]],cs=[0,(W-1)*4,((H-1)*W)*4,((H-1)*W+W-1)*4].map(px),tr=cs.filter(c=>c[3]<20).length>=3,bg=cs[0];
  let x0=W,y0=H,x1=-1,y1=-1,lum=0,cnt=0;
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const i=(y*W+xx)*4;if(d[i+3]<25)continue;if(!tr&&Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2])<40)continue;
    if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y;if((xx+y)%3===0){lum+=.299*d[i]+.587*d[i+1]+.114*d[i+2];cnt++}}
  if(x1<0)return{logo:cv.toDataURL('image/png'),light:false};
  const pad=Math.round(Math.max(x1-x0,y1-y0)*.015),cx=Math.max(0,x0-pad),cy=Math.max(0,y0-pad),cw=Math.min(W,x1+pad+1)-cx,ch=Math.min(H,y1+pad+1)-cy;
  const o=document.createElement('canvas');o.width=cw;o.height=ch;o.getContext('2d').drawImage(cv,cx,cy,cw,ch,0,0,cw,ch);
  return{logo:o.toDataURL('image/png'),light:tr&&cnt>0&&lum/cnt>208};
}

function parseCSV(t){
  t=String(t||'').replace(/^\ufeff/,'');const first=t.split('\n')[0]||'';const d=[';','\t',','].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function toCSV(rows,sep=';'){return '\ufeff'+rows.map(r=>r.map(v=>{v=String(v??'');return (v.includes(sep)||/["\n\r]/.test(v))?'"'+v.replace(/"/g,'""')+'"':v}).join(sep)).join('\r\n')}
function csvMap(head,map){const h=head.map(x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim());const idx={};for(const [k,alts] of Object.entries(map)){idx[k]=h.findIndex(x=>alts.some(a=>x===a||x.startsWith(a)))}return idx}

async function importCustomersCSV(text){

  for(const r of rows.slice(1)){const c={};for(const [k,i] of Object.entries(ix))if(i>=0)c[k]=(r[i]||'').trim();if(!c.name)continue;

}

const DEF_CUT=['Pogosta vprašanja','Pogosta vprasanja','Sprejemamo samo plačila','Naš TRR za plačila','Frequently asked questions','Häufig gestellte Fragen'];
function cutMarkers(){return String(S.settings.cutMarkers??DEF_CUT.join('\n')).split('\n').map(x=>x.trim()).filter(x=>x.length>=4)}
function cleanDesc(t){
  if(!t)return t||'';let s=String(t),low=s.toLowerCase(),cut=-1;
  for(const m of cutMarkers()){const i=low.indexOf(m.toLowerCase());if(i>=0&&(cut<0||i<cut))cut=i}
  if(cut>=0)s=s.slice(0,cut);
  return s.replace(/[\s•\-–:]+$/,'').trim();
}

function ensureExtras(q){

  e.transport={on:false,title:'',desc:'',net:0,vat:null,...(e.transport||{})};
  e.mont={on:false,title:'',desc:'',fixed:false,total:0,vat:null,...(e.mont||{})};

  if(!Array.isArray(m.work)){m.work=[];if(+m.hours||+m.rate)m.work.push({name:'',hours:+m.hours||0,rate:+m.rate||0})}
  delete m.hours;delete m.rate;

function cleanTitle(t){
  const s=String(t||'');if(s.length<60)return s;
  const parts=s.split(/\s+\/\s+/);
  const keep=parts.filter((p,i)=>i===0||!(p.length>30&&/[.!?](\s|$)/.test(p)));
  let out=keep.join(' / ');

function localSummary(text,max=5){
  const t=cleanDesc(String(text||''));if(!t)return '';
  const lines=t.split('\n').map(l=>l.trim()).filter(Boolean);
  const bullets=lines.filter(l=>/^[•\-–*]\s*/.test(l)).map(l=>l.replace(/^[•\-–*]\s*/,''));
  const junk=/(dostav|poštnin|plačil|garancij|povpraševanj|pokličite|trr|naročil|zalog|kontakt|cookie|piškot)/i;
  let pts=bullets.filter(b=>b.length>3&&b.length<160&&!junk.test(b));
  if(pts.length<3){
    const sents=lines.filter(l=>!/^[•\-–*]/.test(l)).join(' ').split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>x.length>25&&x.length<220&&!junk.test(x));
    const score=s=>(s.match(/\d/g)||[]).length*2+(s.match(/\b(mm|cm|kg|kW|V|W|l|m²|aluminij|jeklo|inox|vodoodporn|združljiv|primern|za\s+[A-ZČŠŽ])/gi)||[]).length*3+(s.length<140?2:0);
    pts=[...pts,...sents.map((s,i)=>[s,score(s)-i*.2]).sort((a,b)=>b[1]-a[1]).map(x=>x[0])];
  }
  return [...new Set(pts)].slice(0,max).map(p=>'- '+p.replace(/\s+/g,' ')).join('\n');
}
async function aiSummary(title,text,lang){
  const st=S.settings,mode=st.aiMode||'local';
  if(mode==='local')return{text:localSummary(text),ai:false};
  const L={sl:'slovenščini',en:'English',de:'Deutsch'}[lang]||'slovenščini';
  const prompt=`Si pomočnik trgovine z dodatno opremo za vozila. Iz spodnjega opisa izdelka napiši KRATEK opis za ponudbo kupcu v jeziku: ${L}.
Pravila: 3 do 6 alinej, vsaka se začne z "- ", največ 15 besed na alinejo. Samo bistvo izdelka: kaj je, za katero vozilo je, material, mere/teža, ključne funkcije in kaj je vključeno. Brez marketinških fraz, brez cen, dostave, plačila, garancije, zaloge in kontaktov. Ne izmišljuj podatkov. Vrni samo alineje, brez uvoda.

Naziv: ${title}
Opis:
${String(text||'').slice(0,12000)}`;
  const body={model:st.aiModel||'claude-haiku-4-5-20251001',max_tokens:600,messages:[{role:'user',content:prompt}]};
  let r;
  if(mode==='worker'){const px=(st.proxy||'').trim().replace(/\/+$/,'');if(!px)throw new Error('vpiši naslov posrednika (Cloudflare Worker)');
    r=await fetch(px+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
  else{const key=(st.aiKey||'').trim();if(!key)throw new Error('vpiši API ključ v Nastavitvah');
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)})}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&j.error.message)||j.message||('HTTP '+r.status));
  const out=(j.content||[]).map(c=>c.type==='text'?c.text:'').join('').trim();
  if(!out)throw new Error('prazen odgovor');
  return{text:out.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>/^[-•*]/.test(l)?'- '+l.replace(/^[-•*]\s*/,''):l).join('\n'),ai:true};
}

    ${labels.map((l,i)=>series.map((s,j)=>{const h=(s.v[i]/max)*(H-10),x=pad+4+i*bw+j*(bw-6)/k;return `<rect x="${x}" y="${H-h}" width="${Math.max(2,(bw-6)/k-2)}" height="${h}" rx="2" fill="${s.c}"><title>${esc(l)} · ${esc(s.n)}: ${fmtv(s.v[i])}</title></rect>`}).join('')+`<text x="${pad+4+i*bw+(bw-6)/2}" y="${H+16}" text-anchor="middle" font-size="10" fill="#7A8497">${esc(l)}</text>`).join('')}</svg>

      if(a==='del'){if(confirm('Izbrišem kampanjo?')){S.campaigns=S.campaigns.filter(x=>x.id!==c.id);await saveCampaigns();closeModal();renderMarketing()}return}
      if(!c.subject){toast('Vpiši zadevo e-pošte.','err');return}
      const R=segmentList(c.segment,c.kw);
      const markSent=async()=>{c.sentAt=today();c.sentTs=Date.now();c.recipients=R.map(x=>x.id);await save()};
      await save();
      if(a==='save'){closeModal();renderMarketing();toast('Kampanja shranjena.');return}
      if(a==='brtest'){const to=prompt('Na kateri naslov pošljem testno sporočilo?',S.settings.company.email||'');if(!to)return;busy(true,'Pošiljam test prek Brevo …');try{await brevoSend(c,to);toast('Testno sporočilo poslano. Preveri tudi mapo Spam in oceno na mail-tester.com.','',9000)}catch(err){toast('Brevo: '+err.message,'err',9000)}finally{busy(false)}return}
      if(a==='brevo'){if(!R.length){toast('Ciljna skupina je prazna.','err');return}if(!confirm(`Pošljem kampanjo »${c.subject}« prek Brevo ${R.length} prejemnikom?`))return;busy(true,'Pošiljam prek Brevo …');try{await brevoSend(c);await markSent();closeModal();renderMarketing();toast(`Kampanja poslana ${R.length} prejemnikom prek Brevo.`)}catch(err){toast('Brevo: '+err.message,'err',9000)}finally{busy(false)}return}
      if(a==='sent'){if(!R.length){toast('Ciljna skupina je prazna.','err');return}await markSent();closeModal();renderMarketing();toast(`Označeno kot poslano ${R.length} prejemnikom. Rezultat se meri 30 dni.`);return}
      if(a==='html'){download(new Blob([`<!DOCTYPE html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(fillMk(c.subject,c,''))}</title></head><body style="margin:0">${campaignHTML({...c,_name:'{{ contact.FIRSTNAME }}'})}</body></html>`],{type:'text/html'}),`${(c.subject||'kampanja').replace(/[^\wčšžČŠŽ-]+/g,'-').slice(0,40)}.html`);toast('HTML prenesen (z imenom prejemnika za Brevo). V Brevo: Kampanje → Ustvari → Uvozi HTML. Po pošiljanju klikni »Označi poslano«.','',10000);return}
      if(a==='copy'){try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([campaignHTML(c)],{type:'text/html'}),'text/plain':new Blob([campaignText(c)],{type:'text/plain'})})]);toast('Kopirano. V Gmailu odpri novo sporočilo in prilepi (Ctrl+V). Prejemnike dodaj v BCC.','',8000)}catch{try{await navigator.clipboard.writeText(campaignText(c));toast('Kopirano kot besedilo.')}catch{toast('Kopiranje ni podprto v tem brskalniku.','err')}}return}
      if(a==='bcc'){if(!R.length){toast('V ciljni skupini ni prejemnikov s soglasjem (zavihek Prejemniki).','err',7000);return}
        const batch=40,parts=[];for(let i=0;i<R.length;i+=batch)parts.push(R.slice(i,i+batch));
        const go=i=>{location.href=`mailto:${encodeURIComponent(S.settings.company.email||'')}?bcc=${encodeURIComponent(parts[i].map(r=>r.email).join(','))}&subject=${encodeURIComponent(fillMk(c.subject,c,''))}&body=${encodeURIComponent(campaignText(c))}`};
        go(0);await markSent();
        if(parts.length>1)toast(`Prejemnikov je ${R.length} – pošiljaš v ${parts.length} delih po ${batch}.`,'',15000,{label:'Naslednji del',fn:(()=>{let k=1;return function nx(){go(k);k++;if(k<parts.length)toast(`Del ${k}/${parts.length}`,'',15000,{label:'Naslednji del',fn:nx})}})()});
        else toast(`Odprt je e-poštni program – ${R.length} prejemnikov v skriti kopiji (BCC).`,'',7000);return}
    }});
}

/* ================= customers auto-save from quote ================= */
async function autoSaveCustomer(q){
  const c=q&&q.customer||{};const name=(c.name||'').trim();if(name.length<2)return;
  let ex=q.customerId&&S.customers.find(x=>x.id===q.customerId);
  if(ex&&ex.name.trim().toLowerCase()!==name.toLowerCase())ex=null;
  if(!ex)ex=S.customers.find(x=>(x.name||'').trim().toLowerCase()===name.toLowerCase());
  const data={};CUST_FIELDS.forEach(k=>{if((c[k]||'').trim())data[k]=c[k].trim()});
  if(ex){if(CUST_FIELDS.some(k=>data[k]&&data[k]!==ex[k])){Object.assign(ex,data);await saveCustomers()}if(q.customerId!==ex.id){q.customerId=ex.id;changed()}}
  else{const n=await upsertCustomer({...data,type:/\b(d\.o\.o|s\.p|d\.d|k\.d|z\.o\.o|gmbh|ltd)\b/i.test(name)?'podjetje':'oseba'});q.customerId=n.id;changed();toast(`${name} je samodejno dodan med stranke.`)}
}

/* ================= storage: auto backup, Drive sync, restore ================= */
const APP_NAME='STIK Prodaja';
function backupData(){return{app:'stik-ponudbe-backup',name:APP_NAME,v:3,date:new Date().toISOString(),settings:S.settings,customers:S.customers,quotes:S.quotes,prices:S.prices,todos:S.todos,orders:S.orders,ships:S.ships,campaigns:S.campaigns,suppliers:S.suppliers,pos:S.pos,claims:S.claims,mk:S.mk,recs:S.recs,events:S.events,drive:S.drive}}
async function backupBlob(){const d=backupData();try{d.files=(await DB.all('files')).filter(f=>!/^video/.test(f.type))}catch{d.files=[]}return new Blob([JSON.stringify(d)],{type:'application/json'})}
async function restoreAll(j){
  const oldQ=S.quotes.map(q=>q.id);
  for(const id of oldQ)await DB.del('quotes',id);
  S.quotes=j.quotes||[];for(const q of S.quotes)await DB.put('quotes',q);
  S.customers=j.customers||[];await saveCustomers();S.prices=j.prices||[];await savePrices();S.todos=j.todos||[];await saveTodos();
  S.orders=j.orders||[];await saveOrders();S.ships=j.ships||[];await saveShips();S.campaigns=j.campaigns||[];await saveCampaigns();
  S.suppliers=j.suppliers||[];await saveSup();S.pos=j.pos||[];await savePO();S.claims=j.claims||[];await saveClaims();S.mk=mergeDeep(DEF_MK,j.mk||{});await saveMk();S.recs=j.recs||{};await saveRecsNow();S.events=j.events||[];await saveEvents();S.drive=j.drive||{};await saveDrive();
  for(const f of j.files||[])await DB.put('files',f);
  if(j.settings){const keep={driveId:S.settings.driveId,driveFolder:S.settings.driveFolder,aiKey:S.settings.aiKey};S.settings=mergeDeep(DEF_SETTINGS,j.settings);Object.assign(S.settings,keep);await DB.put('kv',S.settings,'settings')}
  renderNav();
}
let bkState='';
const autoBackup=debounce(async()=>{
  if(!S.dir||!DB.db)return;
  try{const p=await S.dir.queryPermission({mode:'readwrite'});if(p!=='granted'){bkState='paused';return}
    const blob=await backupBlob();const w=async(name)=>{const fh=await S.dir.getFileHandle(name,{create:true});const ws=await fh.createWritable();await ws.write(blob);await ws.close()};
    await w('STIK-Prodaja-podatki.json');
    const d=today();if(S.settings.lastDailyBk!==d){await w(`STIK-Prodaja-kopija-${d}.json`);S.settings.lastDailyBk=d}
    S.settings.lastBackup=Date.now();DB.quiet=true;try{await DB.put('kv',S.settings,'settings')}finally{DB.quiet=false}bkState='ok';
  }catch(e){bkState='err';console.warn('backup',e)}
},8000);
async function resumeDir(){if(!S.dir)return false;try{let p=await S.dir.queryPermission({mode:'readwrite'});if(p!=='granted')p=await S.dir.requestPermission({mode:'readwrite'});if(p==='granted'){bkState='ok';autoBackup();return true}}catch{}return false}
async function driveFind(tok,name){const H={Authorization:'Bearer '+tok};const fid=S.settings.driveFolder;const q=encodeURIComponent(`name='${name}' and trashed=false${fid?` and '${fid}' in parents`:''}`);const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc`,{headers:H});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'iskanje ni uspelo');return(j.files||[])[0]||null}
async function driveSyncUp(){
  const tok=await driveToken();if(!tok)return;busy(true,'Pošiljam podatke v Google Drive …');
  try{const name='STIK-Prodaja-podatki.json',ex=await driveFind(tok,name).catch(()=>null);
    if(ex){const r=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${ex.id}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:await backupBlob()});if(!r.ok)throw new Error('posodobitev ni uspela')}
    else await driveUpload(tok,await backupBlob(),name,'application/json');
    S.settings.lastBackup=Date.now();S.settings.lastDrive=Date.now();saveSettings();toast('Podatki so shranjeni v Google Drive (mapa »STIK Ponudbe«).');}
  catch(e){toast('Drive: '+e.message,'err',8000)}finally{busy(false)}
}
async function driveSyncDown(){
  const tok=await driveToken();if(!tok)return;busy(true,'Iščem podatke v Google Drive …');
  try{const f=await driveFind(tok,'STIK-Prodaja-podatki.json');if(!f){busy(false);toast('V Drive še ni shranjenih podatkov. Najprej jih pošlji z naprave, kjer delaš.','err',8000);return}
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,{headers:{Authorization:'Bearer '+tok}});const j=await r.json();busy(false);
    if(!confirm(`Podatki v Drive so z dne ${new Date(f.modifiedTime).toLocaleString('sl-SI')}:\n${j.quotes?.length||0} ponudb, ${j.orders?.length||0} naročil, ${j.customers?.length||0} strank.\n\nZamenjam vse podatke v tej napravi s temi?`))return;
    await restoreAll(j);toast('Podatki prenešeni iz Google Drive.');showList();}
  catch(e){busy(false);toast('Drive: '+e.message,'err',8000)}
}
function backupAgeDays(){const t=+S.settings.lastBackup||0;return t?Math.floor((Date.now()-t)/864e5):null}
function backupBanner(){if(!S.quotes.length)return '';const a=backupAgeDays();if(bkState==='paused')return `<div class="bkbanner">${ic('folder')}<span>Samodejna varnostna kopija v mapo je zaustavljena (brskalnik zahteva potrditev).</span><button class="btn sm" id="bkResume">Nadaljuj</button></div>`;
  if(a===null||a>=7)return `<div class="bkbanner">${ic('cloud')}<span>${a===null?'Podatki še niso varnostno kopirani.':`Zadnja varnostna kopija je bila pred ${a} dnevi.`} Podatki so shranjeni samo v tej napravi.</span><button class="btn sm sig" id="bkNow">Shrani kopijo</button></div>`;return ''}

/* ================= install help ================= */
function platform(){const u=navigator.userAgent;return /iPhone|iPad|iPod/.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)?'ios':/Android/.test(u)?'android':/Mac/.test(u)?'mac':'win'}
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function installHelp(){

CDN.xlsx='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

CDN.pdfw='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function readTableFile(f){
  const n=f.name.toLowerCase();
  if(/\.(xlsx|xlsm|xls|ods)$/.test(n)){await loadScript(CDN.xlsx);const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).map(r=>r.map(x=>String(x??'').trim())).filter(r=>r.some(Boolean))}
  if(/\.pdf$/.test(n)||f.type==='application/pdf')return pdfRows(await f.arrayBuffer());
  return parseCSV(await f.text());
}
async function pdfRows(buf){
  await loadScript(CDN.pdfjs);const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=CDN.pdfw;
  const pdf=await lib.getDocument({data:buf}).promise;const rows=[];
  for(let p=1;p<=Math.min(pdf.numPages,60);p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();
    const lines={};tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]/3);(lines[y]=lines[y]||[]).push({x:it.transform[4],w:it.width||it.str.length*4,s:it.str.trim()})});
    Object.keys(lines).map(Number).sort((a,b)=>b-a).forEach(y=>{const L=lines[y].sort((a,b)=>a.x-b.x);const cells=[];let lastEnd=-1e9;L.forEach(t=>{if(cells.length&&t.x-lastEnd<6)cells[cells.length-1]+=' '+t.s;else cells.push(t.s);lastEnd=t.x+t.w});rows.push(cells)});}
  const maxC=Math.max(...rows.map(r=>r.length));return rows.filter(r=>r.length>=Math.min(3,maxC));
}
async function aiTable(rows){
  const text=rows.slice(0,400).map(r=>r.join(' | ')).join('\n');
  const out=await aiRaw(`Iz spodnjega besedila cenika dobavitelja izlušči artikle. Vrni SAMO JSON seznam oblike [{"sku":"","name":"","unit":"","net":0,"gross":0,"vat":22,"desc":""}]. net = cena brez DDV kot število (decimalna pika), gross = cena z DDV, če je navedena, sicer 0. Ne izmišljuj artiklov.\n\n${text}`,4000);
  const j=JSON.parse(out.slice(out.indexOf('['),out.lastIndexOf(']')+1));

async function fillPriceImages(){

  let k=0,ok=0;for(const p of L){busy(true,`Iščem slike … ${++k}/${L.length}`);
    try{const [pg,sh]=await Promise.allSettled([fetchVia(p.url,'text',12000),tryShopify(p.url)]);const im=(sh.status==='fulfilled'&&sh.value?.images?.[0])||(pg.status==='fulfilled'&&parsePage(pg.value.body,pg.value.final).images[0]);
      if(im){p.imageUrl=im;try{p.image=await urlToDataURL(im)}catch{p.image=im}ok++}}catch{}}
  busy(false);await savePrices();renderPrices();toast(`Dodanih ${ok} slik od ${L.length}.`);
}

const saveSup=()=>DB.put('kv',S.suppliers,'suppliers'),savePO=()=>DB.put('kv',S.pos,'pos');
const PO_ST={osnutek:'Za poslati',naroceno:'Čaka potrditev',potrjeno:'Potrjeno',delno:'Delno prispelo',prispelo:'Prispelo',preklicano:'Preklicano'};
function poStatus(p){if(p.cancelled)return'preklicano';const L=p.lines||[];if(L.length&&L.every(l=>l.arrived))return'prispelo';if(L.some(l=>l.arrived))return'delno';if(p.confirmed)return'potrjeno';if(p.sentAt||p.date)return'naroceno';return'osnutek'}
function nextPONumber(){const y=today().slice(0,4),st=S.settings;if(st.poYear!==y){st.poYear=y;st.nextPO=1}const n=+st.nextPO||1;st.nextPO=n+1;saveSettings();return `D${y}-${String(n).padStart(3,'0')}`}
const poOfLine=lid=>S.pos.find(p=>!p.cancelled&&(p.lines||[]).some(l=>l.lineId===lid));
async function createPO(supId,lines){
  const sup=S.suppliers.find(s=>s.id===supId);
  const p={id:uid(),number:nextPONumber(),supplierId:supId,supplierName:sup?.name||'',created:Date.now(),date:'',sentAt:0,confirmed:false,confirmedDate:'',supplierRef:'',expected:sup&&+sup.leadDays?isoAdd(today(),+sup.leadDays):'',arrivedDate:'',lines:lines||[],files:[],note:'',cancelled:false};
  S.pos.push(p);await savePO();return p;
}
async function syncPOtoOrders(p){
  let ch=false;(p.lines||[]).forEach(l=>{if(!l.orderId)return;const o=S.orders.find(x=>x.id===l.orderId);const ol=o&&o.lines.find(x=>x.id===l.lineId);if(!ol)return;
    const st=l.arrived?'pri':(p.date||p.sentAt)?'nar':ol.st;if(ol.st!=='mon'&&ol.st!==st&&!(ol.st==='pri'&&st==='nar')){ol.st=st;ch=true}
    const sup=`${p.supplierName}${p.supplierRef?' · potrditev '+p.supplierRef:''} (${p.number})`;if(ol.supplier!==sup){ol.supplier=sup;ch=true}});
  if(ch)await saveOrders();
}

async function aiRaw(prompt,max=1500){
  const st=S.settings,mode=st.aiMode||'local';
  if(mode==='local')throw new Error('AI ni vklopljen – Nastavitve → Opisi izdelkov in AI');
  const body={model:st.aiModel||'claude-haiku-4-5-20251001',max_tokens:max,messages:[{role:'user',content:prompt}]};let r;
  if(mode==='worker'){const px=(st.proxy||'').trim().replace(/\/+$/,'');if(!px)throw new Error('vpiši naslov posrednika');r=await fetch(px+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
  else{const key=(st.aiKey||'').trim();if(!key)throw new Error('vpiši API ključ');r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)})}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||j.message||('HTTP '+r.status));
  return (j.content||[]).map(c=>c.type==='text'?c.text:'').join('').trim();
}

function mkCtx(){const p=S.mk.plan,c=S.settings.company;return `Podjetje: ${c.name||''} (${c.web||''}), trgovina in montaža opreme za pickupe in terenska vozila v Sloveniji.\nCiljne skupine: ${p.audiences||'lastniki pickupov, obrtniki, overlanderji'}\nKljučna sporočila: ${p.usp||'strokovna montaža, preizkušena oprema'}\nTon: ${p.voice||'strokoven, praktičen, sproščen'}\nJezik: slovenščina. Ne izmišljuj cen ali lastnosti, ki niso podane.`}

async function brevo(path,method='GET',body){const px=(S.settings.proxy||'').trim().replace(/\/+$/,'');if(!px)throw new Error('vpiši naslov posrednika (Worker) v Nastavitvah');
  const r=await fetch(px+'/brevo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,method,body})});const t=await r.text();let j={};try{j=t?JSON.parse(t):{}}catch{}if(!r.ok)throw new Error(j.message||('Brevo HTTP '+r.status));return j}
async function brevoSend(c,test){
  const b=S.mk.brevo||{},R=segmentList(c.segment,c.kw);if(!b.senderEmail)throw new Error('vpiši pošiljatelja v Marketing → Kanali in nastavitve');
  const html=`<!DOCTYPE html><html><body style="margin:0">${campaignHTML({...c,_name:'{{ contact.FIRSTNAME }}',_brevo:1})}</body></html>`;
  let listId=+b.listId||0;
  if(!test){if(!R.length)throw new Error('ni prejemnikov s soglasjem');
    if(+b.folderId){const l=await brevo('contacts/lists','POST',{name:`STIK ${c.subject} ${today()}`.slice(0,50),folderId:+b.folderId});listId=l.id}
    if(!listId)throw new Error('vpiši ID seznama ali ID mape v nastavitvah Brevo');
    for(const x of R){const p=(x.type==='oseba'?x.name:x.contact||'').split(' ');await brevo('contacts','POST',{email:x.email,attributes:{FIRSTNAME:p[0]||'',LASTNAME:p.slice(1).join(' ')},listIds:[listId],updateEnabled:true})}}
  const camp=await brevo('emailCampaigns','POST',{name:c.subject.slice(0,60),subject:fillMk(c.subject,c,''),sender:{name:b.senderName||S.settings.company.name,email:b.senderEmail},htmlContent:html,recipients:{listIds:[listId||1]}});
  if(test){await brevo(`emailCampaigns/${camp.id}/sendTest`,'POST',{emailTo:[test]});return camp}
  await brevo(`emailCampaigns/${camp.id}/sendNow`,'POST',{});return camp;
}

function calItems(from,to){

const gcal={last:0,busy:false,err:'',

function gcalBody(e){const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Ljubljana';const b={summary:e.title,location:e.location||'',description:(e.desc||'')+'\n\n[STIK Prodaja]',reminders:+e.remind?{useDefault:false,overrides:[{method:'popup',minutes:+e.remind}]}:{useDefault:true}};

function fromGcal(g){const allDay=!!g.start?.date,s=g.start?.dateTime||g.start?.date||'',en=g.end?.dateTime||g.end?.date||'';const loc=x=>{if(!x)return['',''];if(x.length===10)return[x,''];const d=new Date(x);return[`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`]};

async function gcalSync(quiet){
  if(!S.settings.driveId){if(!quiet){toast('Najprej v Nastavitvah vpiši Google Client ID.','err');showSettings()}return}
  if(gcal.busy)return;if(quiet&&!gcal.ok())return;
  const tok=await driveToken().catch(err=>{gcal.err=err.message;return null});if(!tok){if($('#vCal').classList.contains('on'))renderCal();return}
  gcal.busy=true;gcal.err='';if($('#vCal').classList.contains('on'))renderCal();
  const cal=encodeURIComponent((S.settings.gcalId||'primary').trim()),base=`https://www.googleapis.com/calendar/v3/calendars/${cal}/events`,H={Authorization:'Bearer '+tok,'Content-Type':'application/json'};
  const api=async(url,o={})=>{const r=await fetch(url,{...o,headers:H});if(r.status===204||r.status===410)return{};const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===404&&o.method==='DELETE')return{};throw new Error(j.error?.message||('HTTP '+r.status))}return j};

    for(const e of [...S.events]){
      if(e.deleted){if(e.gcalId)await api(`${base}/${encodeURIComponent(e.gcalId)}`,{method:'DELETE'});S.events=S.events.filter(x=>x!==e);del++;continue}
      if(!e.gcalId){const j=await api(base,{method:'POST',body:JSON.stringify(gcalBody(e))});e.gcalId=j.id;e.gUpdated=j.updated;e.dirty=false;up++}
      else if(e.dirty){const j=await api(`${base}/${encodeURIComponent(e.gcalId)}`,{method:'PATCH',body:JSON.stringify(gcalBody(e))});e.gUpdated=j.updated;e.dirty=false;up++}}
    const from=isoAdd(today(),-60),to=isoAdd(today(),400);let items=[],pt='';
    do{const j=await api(`${base}?singleEvents=true&orderBy=startTime&maxResults=2500&showDeleted=false&timeMin=${from}T00:00:00Z&timeMax=${to}T23:59:59Z${pt?'&pageToken='+pt:''}`);items=items.concat(j.items||[]);pt=j.nextPageToken||''}while(pt);
    const seen=new Set();
    items.filter(g=>g.status!=='cancelled').forEach(g=>{seen.add(g.id);const loc=S.events.find(x=>x.gcalId===g.id);const d=fromGcal(g);
      if(!loc){S.events.push({id:uid(),gcalId:g.id,origin:/\[STIK Prodaja\]/.test(g.description||'')?'app':'google',remind:0,...d});down++}
      else if(!loc.dirty&&loc.gUpdated!==g.updated){Object.assign(loc,d);down++}});
    const before=S.events.length;S.events=S.events.filter(x=>!x.gcalId||x.dirty||seen.has(x.gcalId)||(x.endDate||x.date)<from||x.date>to);del+=before-S.events.length;
    S.settings.gcalLast=Date.now();saveSettings();await saveEvents();
    if(!quiet)toast(`Google koledar: poslano ${up}, prejeto ${down}${del?`, odstranjeno ${del}`:''}.`);
  }catch(err){gcal.err=err.message;if(!quiet)toast('Google koledar: '+err.message,'err',9000)}
  finally{gcal.busy=false;if($('#vCal').classList.contains('on'))renderCal();if($('#vDash').classList.contains('on'))renderDash()}
}

function driveSpace(sp){S.drive[sp]=S.drive[sp]||{folders:(DRIVE_DEF[sp]||[]).map(n=>({id:uid(),name:n,parent:''})),items:[]};return S.drive[sp]}
const DRV={};
function driveHTML(sp,title,sub){
  const D=driveSpace(sp),st=DRV[sp]=DRV[sp]||{f:'',q:''},q=st.q.toLowerCase();
  const path=[];let f=st.f;while(f){const x=D.folders.find(y=>y.id===f);if(!x)break;path.unshift(x);f=x.parent}
  const cnt=id=>{const sub=D.folders.filter(x=>x.parent===id).length;return sub+D.items.filter(x=>x.folder===id).length};
  const folders=q?[]:D.folders.filter(x=>(x.parent||'')===st.f).sort((a,b)=>a.name.localeCompare(b.name,'sl'));
  const items=D.items.filter(x=>q?[x.name,x.text,x.url].join(' ').toLowerCase().includes(q):(x.folder||'')===st.f).sort((a,b)=>b.created-a.created);
  const fpath=id=>{const n=[];let x=D.folders.find(y=>y.id===id);while(x){n.unshift(x.name);x=D.folders.find(y=>y.id===x.parent)}return n.join(' / ')};
  return `<div class="drive" data-space="${sp}"><div class="list-head"><div><h1 style="margin:0">${esc(title)}</h1><p class="help" style="margin:2px 0 0">${esc(sub||'Mape, datoteke, povezave in beležke')}</p></div><span class="grow"></span>
    <input class="inp dq" data-dq value="${esc(st.q)}" placeholder="Išči v vseh mapah …" style="width:220px">
    <button class="btn" data-da="pdf">${ic('print')}PDF</button><button class="btn" data-da="folder">${ic('folder')}Nova mapa</button><button class="btn" data-da="link">${ic('link')}Povezava</button><button class="btn" data-da="note">${ic('pen')}Beležka</button><button class="btn sig" data-da="upload">${ic('upload')}Naloži datoteke</button></div>
    <div class="crumbs"><a data-df="">${esc(title)}</a>${path.map(x=>` / <a data-df="${x.id}">${esc(x.name)}</a>`).join('')}${q?` · rezultati iskanja`:''}</div>
    ${folders.length?`<div class="fgrid">${folders.map(x=>`<div class="fcard" data-df="${x.id}">${ic('folder')}<div><b>${esc(x.name)}</b><small>${cnt(x.id)} elementov</small></div><button class="btn sm ghost icon" data-dfm="${x.id}" aria-label="Uredi mapo">⋯</button></div>`).join('')}</div>`:''}
    <div class="ddrop" data-ddrop>Povleci datoteke sem, da jih naložiš v to mapo</div>
    <div class="dlist">${items.length?items.map(x=>`<div class="ditem" data-di="${x.id}"><div class="dth" data-thumb="${x.type==='file'&&/^image/.test(x.mime)?x.fileId:''}">${x.type==='link'?ic('link'):x.type==='note'?ic('pen'):`<span class="ftype">${fileIcon(x.mime||'')}</span>`}</div>
      <div class="dn"><b>${esc(x.name)}</b><small>${x.type==='file'?`${Math.max(1,Math.round((x.size||0)/1024))} kB · `:''}${dateSl(new Date(x.created).toISOString().slice(0,10))}${q&&x.folder?' · '+esc(fpath(x.folder)):''}${x.type==='link'?' · '+esc(x.url):''}</small></div>
      <div class="acts"><button class="btn sm" data-dio="${x.id}">${x.type==='link'?'Odpri':'Poglej'}</button>${x.type==='file'?`<button class="btn sm" data-dip="${x.id}" aria-label="Natisni">${ic('print')}</button><button class="btn sm" data-did="${x.id}" aria-label="Prenesi">${ic('download')}</button>`:''}${x.type==='file'&&sp==='ceniki'&&/pdf|sheet|excel|csv/.test(x.mime)?`<button class="btn sm" data-dconv="${x.id}">V tabelo</button>`:''}<button class="btn sm ghost icon" data-dim="${x.id}" aria-label="Več">⋯</button></div></div>`).join(''):`<div class="empty" style="padding:22px"><p>${q?'Ni zadetkov.':'V tej mapi še ni datotek.'}</p></div>`}</div></div>`;
}
function afterDrive(root){fillThumbs(root);const z=root.querySelector('[data-ddrop]');if(z&&!z.dataset.on){z.dataset.on=1;const sp=root.querySelector('.drive').dataset.space;
